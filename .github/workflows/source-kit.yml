name: Audit and package source kit

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source publication and create ZIP
        run: python tools/audit_publication.py --zip dist/fifa-street-pc-source-kit.zip
      - name: Test extraction safeguards without a game
        working-directory: street1/project/tools
        run: python -m unittest -v test_fifa_setup

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_publication.py --zip dist/fifa-street-pc-source-kit.zip
      - uses: actions/download-artifact@v4
        with:
          name: Setup
          path: dist
      - name: Publish source-only Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/fifa-street-pc-source-kit.zip dist/Setup.exe \
            --title "FIFA Street PC — $GITHUB_REF_NAME source kit" \
            --notes-file RELEASE-NOTES.md

  launcher:
    # The launcher (installer, Play, Dependencies, PC settings) built from tools/launcher: our own code only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Setup.exe
        run: dotnet build tools/launcher/Launcher.csproj -c Release -p:GameConfig=../../launcher.json -p:AssemblyName=Setup -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: Setup
          path: dist/Setup.exe
